name: pages

# The public Electo site on GitHub Pages. The crawler (Crawl-runner, via Electo's tools/site_data.sh) pushes each new
# build as a branch d-<time> holding the whole site and moves main's current.json to it; this deploys that branch.
# Runs on every such push, and by hand (Actions -> pages -> Run workflow).
on:
  push:
    branches: [main]
    paths: [current.json]
  workflow_dispatch:
  # GitHub's Pages service sometimes stalls a deployment ("finished_file_sync" until the deploy step's time runs out;
  # Nov 9: 14:08, 20:54 and 21:08 UTC), which left the site on the build before. The deploy is tried three times in
  # the run, and every hour a check deploys again when the live site is not on the branch current.json names.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# A newer build (a push) replaces a deploy still in progress; the hourly check and a run by hand wait for it instead,
# then find the site current and stop.
concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: current.json
      - id: cur
        run: |
          br=$(python3 -c "import json;print(json.load(open('current.json'))['branch'])")
          echo "branch=$br" >> "$GITHUB_OUTPUT"
          live=$(curl -fsS --retry 3 --max-time 30 "https://clockworkblack.github.io/electo-data/updates.json?t=$(date +%s)" | python3 -c "import json,sys; print(json.load(sys.stdin).get('branch',''))" 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$live" = "$br" ]; then
            echo "the site already serves $br"; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploying $br (the site serves ${live:-something unreadable})"; echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cur.outputs.go == 'true'
        with:
          ref: ${{ steps.cur.outputs.branch }}
          path: site
      - if: steps.cur.outputs.go == 'true'
        run: |
          rm -rf site/.git
          test -f site/index.html
          echo "deploying ${{ steps.cur.outputs.branch }} ($(find site -type f | wc -l) files)"
      - uses: actions/upload-pages-artifact@v3
        if: steps.cur.outputs.go == 'true'
        with:
          path: site
      # GitHub's list of the run's artifacts can lag the upload by a moment ("No artifacts named github-pages", Nov 9)
      - if: steps.cur.outputs.go == 'true'
        run: sleep 15
      # a deploy normally finishes in seconds; one GitHub stalls is given 12 minutes, then tried again after a pause
      - id: deploy
        if: steps.cur.outputs.go == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 720000
      - name: Pause before deploying again (the first try did not finish)
        if: steps.cur.outputs.go == 'true' && steps.deploy.outcome == 'failure'
        run: sleep 90
      - id: deploy2
        if: steps.cur.outputs.go == 'true' && steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 720000
      - name: Pause before the last try
        if: steps.cur.outputs.go == 'true' && steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 180
      - id: deploy3
        if: steps.cur.outputs.go == 'true' && steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 720000
      - name: Deployed
        if: steps.cur.outputs.go == 'true'
        run: |
          tries=1; [ "${{ steps.deploy.outcome }}" = failure ] && tries=2; [ "${{ steps.deploy2.outcome }}" = failure ] && tries=3
          echo "deployed ${{ steps.cur.outputs.branch }} (try $tries of 3)" | tee -a "$GITHUB_STEP_SUMMARY"
