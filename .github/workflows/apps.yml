name: apps

# Electo as a phone app, built here from the public site: the branch current.json names (the page, its data and the
# offline AI's library), wrapped with Capacitor (app/).
#   android  Electo.apk on the "android" release: https://github.com/ClockworkBlack/electo-data/releases/tag/android
#   ios      Electo-unsigned.ipa on the "ios" release: https://github.com/ClockworkBlack/electo-data/releases/tag/ios
# Each build opens the app in an emulator (Android) or a simulator (iOS) and publishes only when the page came up
# there. A phone that has the app does not need each new build: the page and its data update inside the app (the
# Data button at the top).
#
# Runs by hand (Actions -> apps -> Run workflow). app/README.md says what each secret is for; none is needed to build.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "android, ios or both"
        required: false
        default: both
      publish:
        description: "publish on the releases (no: build and check only)"
        required: false
        default: "yes"
      mac:
        description: "the Mac that builds the iOS app: macos-15 (Apple chip) or macos-15-intel"
        required: false
        default: macos-15
      android_api:
        description: "the Android version the emulator runs (API level; 35 is Android 15)"
        required: false
        default: "35"

permissions:
  contents: write

defaults:
  run:
    shell: bash     # with pipefail: a failed command in the middle of a pipe stops the step

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.what == 'both' || inputs.what == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:          # one Android build at a time; a newer one waits for it
      group: apps-android
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: The site as published
        run: bash app/site.sh site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: The app's web folder
        run: python3 app/bundle.py site
      - name: Android project and APK
        working-directory: app
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # the signing key: the project's own when its four secrets are set; otherwise a key made for this build
          # alone and thrown away, so an APK signed that way cannot be installed over an earlier one (uninstall first)
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/electo.keystore"
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
            echo "SIGNING=project" >> "$GITHUB_ENV"
          else
            export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 24)" ANDROID_KEY_ALIAS=electo
            export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$ANDROID_KEYSTORE_FILE" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" -alias electo -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Electo test build (one-time key), O=Electo" 2>/dev/null
            echo "SIGNING=one-time" >> "$GITHUB_ENV"
          fi
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx cap add android
          bash android.sh
          npx cap sync android
          ( cd android && chmod +x gradlew && ./gradlew --no-daemon -q assembleRelease )
          rm -f "$ANDROID_KEYSTORE_FILE"
          mv android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Electo.apk"
          ls -la "$GITHUB_WORKSPACE/Electo.apk"
          if ! git -C "$GITHUB_WORKSPACE" ls-files --error-unmatch app/package-lock.json >/dev/null 2>&1; then
            echo "---- package-lock.json (commit it as app/package-lock.json to pin these versions) ----"; cat package-lock.json; echo "---- end of package-lock.json ----"
          fi
      - name: What was built (signature, version, not a debug build)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs Electo.apk | grep -v "^WARNING" | tee signer.txt
          "$BT/aapt2" dump badging Electo.apk > badging.txt
          grep -E "^package:|^sdkVersion|^targetSdkVersion|^uses-permission|^application-label:" badging.txt
          if grep -q "application-debuggable" badging.txt; then echo "::error::this is a debug build"; exit 1; fi
          grep -q "versionCode='$APP_VERSION_CODE'" badging.txt || { echo "::error::the APK does not carry version $APP_VERSION_CODE"; exit 1; }
          CERT=$(grep -m1 "certificate SHA-256 digest" signer.txt | sed 's/.*: //')
          [ -n "$CERT" ] || { echo "::error::the APK is not signed"; exit 1; }
          echo "CERT_SHA256=$CERT" >> "$GITHUB_ENV"
          echo "APK_MB=$(( $(stat -c %s Electo.apk) / 1000000 ))" >> "$GITHUB_ENV"
      - name: Let the emulator use the processor's virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the app in an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ inputs.android_api || '35' }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash app/android_check.sh Electo.apk check
      - name: Keep what the check saw (the "app-check" release)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash app/keep_check.sh android
      - name: Publish on the "android" release
        if: github.event_name != 'workflow_dispatch' || inputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(sha256sum Electo.apk | cut -d' ' -f1)
          cp check/shot-android.png Electo-android.png
          if [ "$SIGNING" = project ]; then SIG="Signed with Electo's own key: a newer download installs over this one and keeps its settings."
          else SIG="Test signature: this build is signed with a key made for it alone, so it does not install over an earlier Electo. Uninstall the earlier one first (its saved settings go with it)."; fi
          cat > notes.md <<EOF
          **Electo for Android.** On the phone: download **Electo.apk** below, open it, and allow installs from this source when Android asks. It is not from the Play Store.

          - The site and all of its data are inside (about $APK_MB MB), so it opens without a connection. The **Data** button at the top brings newer data and newer versions of the page; the app checks by itself when it opens.
          - The offline AI is optional: the app downloads its model (about 1 GB) the first time you turn it on in AI settings. It needs a phone with WebGPU (recent Android, with Chrome and Android System WebView up to date).
          - Speak and "Use my location" ask Android for the microphone and the location the first time you use them.
          - $SIG

          Version $APP_VERSION_NAME ($APP_VERSION_CODE), built $(date -u +"%B %-d, %Y %H:%M UTC") from the site as of $SITE_BUILT. Checked before publishing: opened in an Android 15 emulator, where the page came up (screenshot below).
          SHA-256 of Electo.apk: \`$SHA\`
          Signing certificate SHA-256: \`$CERT_SHA256\`

          ![Electo in the emulator](https://github.com/${{ github.repository }}/releases/download/android/Electo-android.png)
          EOF
          gh release view android >/dev/null 2>&1 || gh release create android --title "Electo for Android" --notes-file notes.md --latest
          gh release upload android Electo.apk Electo-android.png --clobber
          gh release edit android --title "Electo for Android" --notes-file notes.md --latest
          echo "published: https://github.com/${{ github.repository }}/releases/tag/android" | tee -a "$GITHUB_STEP_SUMMARY"

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.what == 'both' || inputs.what == 'ios'
    runs-on: ${{ inputs.mac || 'macos-15' }}
    timeout-minutes: 90
    concurrency:
      group: apps-ios
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: The site as published
        run: bash app/site.sh site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The app's web folder
        run: python3 app/bundle.py site
      - name: iOS project
        working-directory: app
        run: |
          xcodebuild -version
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx cap add ios
          bash ios.sh
          npx cap sync ios
      - name: A simulator
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          sdk = tuple(int(x) for x in sys.argv[1].split('.')[:2])
          best = None
          for runtime, devs in d.items():
              if 'iOS' not in runtime: continue
              ver = tuple(int(x) for x in runtime.rsplit('iOS-', 1)[-1].split('-') if x.isdigit())
              if ver[:2] > sdk: continue      # a newer iOS than this Xcode builds for
              for x in devs:
                  if x.get('isAvailable') and x['name'].startswith('iPhone') and 'SE' not in x['name']:
                      key = (ver, 'Pro' not in x['name'], x['name'])
                      if best is None or key > best[0]: best = (key, x['udid'], x['name'], runtime)
          print(best[1]); sys.stderr.write('simulator: %s (%s)\n' % (best[2], best[3].rsplit('.', 1)[-1]))
          " "$SDK")
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM" -b
      - name: Build for the simulator and open the app there
        run: |
          DD="$RUNNER_TEMP/dd"
          ( cd app/ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
              -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath "$DD" -quiet \
              CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$APP_VERSION_NAME" CURRENT_PROJECT_VERSION="$APP_BUILD" build )
          bash app/ios_check.sh "$SIM" "$DD/Build/Products/Debug-iphonesimulator/App.app" check
      - name: Keep what the check saw (the "app-check" release)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash app/keep_check.sh ios
      - name: Build for iPhone and iPad (unsigned)
        run: |
          AR="$RUNNER_TEMP/Electo.xcarchive"
          ( cd app/ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
              -destination "generic/platform=iOS" -archivePath "$AR" -quiet \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              MARKETING_VERSION="$APP_VERSION_NAME" CURRENT_PROJECT_VERSION="$APP_BUILD" archive )
          rm -rf Payload; mkdir Payload; cp -R "$AR/Products/Applications/App.app" Payload/
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" -c "Print :MinimumOSVersion" Payload/App.app/Info.plist
          zip -qry Electo-unsigned.ipa Payload
          ls -la Electo-unsigned.ipa
          echo "IPA_MB=$(( $(stat -f %z Electo-unsigned.ipa) / 1000000 ))" >> "$GITHUB_ENV"
      - name: Publish on the "ios" release
        if: github.event_name != 'workflow_dispatch' || inputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(shasum -a 256 Electo-unsigned.ipa | cut -d' ' -f1)
          cp check/shot-ios.png Electo-ios.png
          cat > notes.md <<EOF
          **Electo for iPhone and iPad (unsigned build).** An iPhone installs only apps signed with an Apple developer certificate, so **Electo-unsigned.ipa** cannot be opened on the phone the way an Android APK can. Two ways to use it:

          - With a sideloading tool on a computer (AltStore or Sideloadly, for example), which signs the file with your own Apple ID and puts it on your phone. With a free Apple ID the app has to be refreshed every 7 days.
          - With an Apple Developer account, to sign it or to send it to TestFlight and the App Store.

          Without either, the site itself works as an app on an iPhone: open https://clockworkblack.github.io/electo-data/ in Safari, then Share → Add to Home Screen.

          - The site and all of its data are inside (about $IPA_MB MB). The **Data** button at the top brings newer data and newer versions of the page.
          - The offline AI is optional and needs iOS 26 or newer; the app downloads its model (about 1 GB) the first time you turn it on.

          Version $APP_VERSION_NAME ($APP_BUILD), built $(date -u +"%B %-d, %Y %H:%M UTC") from the site as of $SITE_BUILT. Checked before publishing: opened in an iPhone simulator, where the page came up (screenshot below). It has not been run on a real iPhone.
          SHA-256 of Electo-unsigned.ipa: \`$SHA\`

          ![Electo in the iPhone simulator](https://github.com/${{ github.repository }}/releases/download/ios/Electo-ios.png)
          EOF
          gh release view ios >/dev/null 2>&1 || gh release create ios --title "Electo for iPhone and iPad (unsigned)" --notes-file notes.md --latest=false
          gh release upload ios Electo-unsigned.ipa Electo-ios.png --clobber
          gh release edit ios --title "Electo for iPhone and iPad (unsigned)" --notes-file notes.md --latest=false
          echo "published: https://github.com/${{ github.repository }}/releases/tag/ios" | tee -a "$GITHUB_STEP_SUMMARY"
