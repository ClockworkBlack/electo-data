name: apps

# Electo as a phone app, built here from the public site: the branch current.json names (the page, its data and the
# offline AI's library), wrapped with Capacitor (app/).
#   android  Electo.apk, and Electo-with-AI.apk with the offline AI's files inside, on the "android" release:
#            https://github.com/ClockworkBlack/electo-data/releases/tag/android
#   ios      Electo-unsigned.ipa on the "ios" release: https://github.com/ClockworkBlack/electo-data/releases/tag/ios
# Each build opens the app in an emulator (Android) or a simulator (iOS) and publishes only when the page came up
# there; the screenshot it took is kept on the "app-check" release either way.
#
# A phone that has the app does not need each new build: the page and its data update inside the app (the Data button
# at the top). A new build matters for someone installing for the first time (less to update on first opening) and
# when the wrapper itself changes.
#
# Runs every Monday, on a change to app/ or to this workflow, and by hand (Actions -> apps -> Run workflow).
# app/README.md says what each secret is for; none is needed to build.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "!app/README.md"
      - ".github/workflows/apps.yml"
      - ".github/actions/ios/**"
  workflow_dispatch:
    inputs:
      what:
        description: "android, ios or both"
        required: false
        default: both
      publish:
        description: "publish on the releases (no: build and check only)"
        required: false
        default: "yes"
      ai:
        description: "also build Electo-with-AI.apk (the offline AI's files inside)"
        required: false
        default: "yes"
      mac:
        description: "the Mac that builds the iOS app first: macos-15-intel or macos-15 (Apple chip); the other is tried when none is free"
        required: false
        default: macos-15-intel
      android_api:
        description: "the Android version the emulator runs (API level; 35 is Android 15)"
        required: false
        default: "35"
  schedule:
    - cron: "41 8 * * 1"

permissions:
  contents: write

defaults:
  run:
    shell: bash     # with pipefail: a failed command in the middle of a pipe stops the step

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.what == 'both' || inputs.what == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:          # one Android build at a time; a newer one waits for it
      group: apps-android
      cancel-in-progress: false
    env:
      EMULATOR_API: ${{ inputs.android_api || '35' }}
    steps:
      - name: Make room when the runner is short of it (two builds, the offline AI's files and an emulator need about 25 GB)
        run: |
          free=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          if [ "$free" -lt 30 ]; then
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
            sudo docker image prune --all --force >/dev/null 2>&1 || true
          fi
          df -h / | tail -1
      - uses: actions/checkout@v5
      - name: The site as published
        run: bash app/site.sh site
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Which files the offline AI needs
        id: models
        if: github.event_name != 'workflow_dispatch' || inputs.ai == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "key=$(python3 app/models.py --key)" >> "$GITHUB_OUTPUT"
      - name: Kept from an earlier build, when they are the same files
        if: steps.models.outputs.key != ''
        uses: actions/cache@v5
        with:
          path: models
          key: app-models-${{ steps.models.outputs.key }}
      - name: The offline AI's files (for Electo-with-AI.apk)
        if: steps.models.outputs.key != ''
        continue-on-error: true     # without them only Electo.apk is built
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 app/models.py site models || { rm -rf models; exit 1; }
      - name: Android project and APKs
        working-directory: app
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # the signing key: the project's own when its four secrets are set; otherwise a key made for this build
          # alone and thrown away, so an APK signed that way cannot be installed over an earlier one (uninstall first)
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/electo.keystore"
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
            echo "SIGNING=project" >> "$GITHUB_ENV"
          else
            export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 24)" ANDROID_KEY_ALIAS=electo
            export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$ANDROID_KEYSTORE_FILE" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" -alias electo -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Electo test build (one-time key), O=Electo" 2>/dev/null
            echo "SIGNING=one-time" >> "$GITHUB_ENV"
          fi
          W="$GITHUB_WORKSPACE"
          python3 bundle.py "$W/site"
          npm ci --no-audit --no-fund
          npx cap add android
          bash android.sh
          npx cap sync android
          ( cd android && chmod +x gradlew && ./gradlew --no-daemon -q assembleRelease )
          mv android/app/build/outputs/apk/release/app-release.apk "$W/Electo.apk"
          # the same app with the offline AI's files inside, when they are here; a failure only leaves this file out
          if [ -f "$W/models/models-used.json" ]; then
            if python3 bundle.py "$W/site" --models "$W/models" && npx cap sync android \
               && ( cd android && ./gradlew --no-daemon -q assembleRelease ) \
               && mv android/app/build/outputs/apk/release/app-release.apk "$W/Electo-with-AI.apk"; then :
            else echo "::warning::Electo-with-AI.apk was not built"; rm -f "$W/Electo-with-AI.apk"; fi
          fi
          rm -f "$ANDROID_KEYSTORE_FILE"
          rm -rf www android/app/build android/app/src/main/assets/public "$W/site" || true
          ls -la "$W"/*.apk; df -h / | tail -1
      - name: What was built (signature, version, not a debug build)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          CERT=""
          for apk in Electo.apk Electo-with-AI.apk; do
            [ -f "$apk" ] || continue
            echo "== $apk"
            "$BT/apksigner" verify --print-certs "$apk" | grep -v "^WARNING" > signer.txt; grep -m2 "certificate" signer.txt
            C=$(grep -m1 "certificate SHA-256 digest" signer.txt | sed 's/.*: //')
            [ -n "$C" ] || { echo "::error::$apk is not signed"; exit 1; }
            [ -z "$CERT" ] || [ "$C" = "$CERT" ] || { echo "::error::the two APKs are signed with different keys"; exit 1; }
            CERT="$C"
            "$BT/aapt2" dump badging "$apk" > badging.txt
            grep -E "^package:|^targetSdkVersion|^uses-permission|^application-label:" badging.txt
            if grep -q "application-debuggable" badging.txt; then echo "::error::$apk is a debug build"; exit 1; fi
            grep -q "versionCode='$APP_VERSION_CODE'" badging.txt || { echo "::error::$apk does not carry version $APP_VERSION_CODE"; exit 1; }
          done
          if [ -f Electo-with-AI.apk ]; then
            # the offline AI's files are inside, stored as they are (the app reads them in place)
            unzip -v Electo-with-AI.apk > inside.txt
            echo "models inside: $(grep -c 'assets/public/models/.*/mlc-chat-config.json' inside.txt)"
            grep "assets/public/models/.*params_shard_0.bin" inside.txt | grep -q "Stored" || { echo "::error::the model's files are not stored uncompressed in Electo-with-AI.apk"; exit 1; }
          fi
          echo "CERT_SHA256=$CERT" >> "$GITHUB_ENV"
      - name: Let the emulator use the processor's virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the app in an emulator
        id: emulator
        continue-on-error: true     # tried once more below: the emulator's own download or start sometimes fails
        timeout-minutes: 20         # three or four minutes when all is well; an emulator that hangs is stopped
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ inputs.android_api || '35' }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash app/android_checks.sh
      - name: An emulator that failed or hung is put away before the second try
        if: steps.emulator.outcome != 'success'
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          timeout 20 "$ADB" -s emulator-5554 emu kill >/dev/null 2>&1 || true
          sleep 3
          pkill -9 -f 'qemu-syste[m]' >/dev/null 2>&1 || true
          pkill -9 -f 'crashpad_handle[r]' >/dev/null 2>&1 || true
          pkill -9 -x netsimd >/dev/null 2>&1 || true
          timeout 20 "$ADB" kill-server >/dev/null 2>&1 || true
          rm -rf "$HOME"/.android/avd/*.avd/*.lock || true
          df -h / | tail -1
      - name: Open the app in an emulator (second try)
        if: steps.emulator.outcome != 'success'
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ inputs.android_api || '35' }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash app/android_checks.sh
      - name: Keep what the check saw (the "app-check" release)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash app/keep_check.sh android
      - name: Publish on the "android" release
        if: github.event_name != 'workflow_dispatch' || inputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="Electo.apk Electo-android.png"
          cp check/shot-android.png Electo-android.png
          if [ -f Electo-with-AI.apk ] && [ ! -f check-ai/ok ]; then rm -f Electo-with-AI.apk; fi     # built but not seen to open: not published
          if [ -f Electo-with-AI.apk ]; then FILES="$FILES Electo-with-AI.apk"; fi
          python3 app/notes.py android > notes.md
          gh release view android >/dev/null 2>&1 || gh release create android --title "Electo for Android" --notes-file notes.md --latest
          gh release upload android $FILES --clobber
          # a file this build did not make is not left beside the new notes
          if [ ! -f Electo-with-AI.apk ]; then gh release delete-asset android Electo-with-AI.apk -y >/dev/null 2>&1 || true; fi
          gh release edit android --title "Electo for Android" --notes-file notes.md --latest
          echo "published: https://github.com/${{ github.repository }}/releases/tag/android ($FILES)" | tee -a "$GITHUB_STEP_SUMMARY"

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.what == 'both' || inputs.what == 'ios'
    runs-on: ${{ inputs.mac || 'macos-15-intel' }}
    timeout-minutes: 90
    concurrency:
      group: apps-ios-diag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ios
        with:
          publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish == 'yes' }}
          token: ${{ github.token }}
          asc_key_id: ${{ secrets.ASC_KEY_ID }}
          asc_issuer_id: ${{ secrets.ASC_ISSUER_ID }}
          asc_key_p8: ${{ secrets.ASC_KEY_P8 }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}

  # GitHub sometimes has no Mac of one kind free and drops the job after a quarter of an hour (Nov 12: "The job was
  # not acquired by Runner of type hosted"): the other kind builds it then. A build that failed for its own reasons
  # fails here again, and the run says so.
  ios-other-mac:
    needs: ios
    if: ${{ always() && needs.ios.result != 'success' && needs.ios.result != 'skipped' }}
    runs-on: ${{ (inputs.mac || 'macos-15-intel') == 'macos-15' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 90
    concurrency:
      group: apps-ios-other-diag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ios
        with:
          publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish == 'yes' }}
          token: ${{ github.token }}
          asc_key_id: ${{ secrets.ASC_KEY_ID }}
          asc_issuer_id: ${{ secrets.ASC_ISSUER_ID }}
          asc_key_p8: ${{ secrets.ASC_KEY_P8 }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}

  # test branch only: what a job that needs "ios" is told about it
  ios-diag:
    needs: ios
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "needs: $NEEDS"
          echo "result: [${{ needs.ios.result }}]"
