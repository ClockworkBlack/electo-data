name: Electo for iOS
description: >
  Builds Electo for iPhone and iPad from the published site on a Mac: opens it in an iPhone simulator, checks that the
  page came up, makes the unsigned IPA and publishes it on the "ios" release. Used by the apps workflow's two iOS jobs
  (one kind of Mac, then the other when the first was not to be had).
inputs:
  publish:
    description: "true: publish on the ios release; anything else: build and check only"
    required: false
    default: "true"
  token:
    description: "the workflow's own token (contents: write), for the releases"
    required: true
  asc_key_id:
    description: "App Store Connect API key ID (optional: with the next three, the build is also signed and sent to TestFlight)"
    required: false
    default: ""
  asc_issuer_id:
    description: "App Store Connect API issuer ID"
    required: false
    default: ""
  asc_key_p8:
    description: "the App Store Connect API key itself (the text of the .p8 file)"
    required: false
    default: ""
  apple_team_id:
    description: "the Apple Developer team ID"
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: The site as published
      shell: bash
      run: bash app/site.sh site
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: The app's web folder
      shell: bash
      run: python3 app/bundle.py site
    - name: iOS project
      shell: bash
      working-directory: app
      run: |
        xcodebuild -version; uname -m
        npm ci --no-audit --no-fund
        npx cap add ios
        bash ios.sh
        npx cap sync ios
    - name: A simulator
      shell: bash
      run: |
        SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
        PICK=$(xcrun simctl list devices available -j | python3 app/ios_sim.py "$SDK")
        echo "simulator: ${PICK#* }"
        echo "SIM=${PICK%% *}" >> "$GITHUB_ENV"; echo "SIM_NAME=${PICK#* }" >> "$GITHUB_ENV"
        xcrun simctl boot "${PICK%% *}"
        xcrun simctl bootstatus "${PICK%% *}" -b
    - name: Build for the simulator and open the app there
      shell: bash
      run: |
        DD="$RUNNER_TEMP/dd"
        ( cd app/ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath "$DD" -quiet \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$APP_VERSION_NAME" CURRENT_PROJECT_VERSION="$APP_BUILD" build )
        bash app/ios_check.sh "$SIM" "$DD/Build/Products/Debug-iphonesimulator/App.app" check
    - name: Keep what the check saw (the "app-check" release)
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: bash app/keep_check.sh ios
    - name: Build for iPhone and iPad (unsigned)
      shell: bash
      run: |
        AR="$RUNNER_TEMP/Electo.xcarchive"
        ( cd app/ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$AR" -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION_NAME" CURRENT_PROJECT_VERSION="$APP_BUILD" archive )
        rm -rf Payload; mkdir Payload; cp -R "$AR/Products/Applications/App.app" Payload/
        /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" -c "Print :MinimumOSVersion" Payload/App.app/Info.plist
        [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/App.app/Info.plist)" = "$APP_BUILD" ] || { echo "::error::the app does not carry build $APP_BUILD"; exit 1; }
        test -f Payload/App.app/public/page.html && test -f Payload/App.app/public/offline.json
        zip -qry Electo-unsigned.ipa Payload
        ls -la Electo-unsigned.ipa
    - name: Publish on the "ios" release
      if: inputs.publish == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        cp check/shot-ios.png Electo-ios.png
        python3 app/notes.py ios > notes.md
        gh release view ios >/dev/null 2>&1 || gh release create ios --title "Electo for iPhone and iPad (unsigned)" --notes-file notes.md --latest=false
        gh release upload ios Electo-unsigned.ipa Electo-ios.png --clobber
        gh release edit ios --title "Electo for iPhone and iPad (unsigned)" --notes-file notes.md --latest=false
        echo "published: https://github.com/${{ github.repository }}/releases/tag/ios" | tee -a "$GITHUB_STEP_SUMMARY"
    # Signed, to TestFlight: only when the four Apple secrets are set (app/README.md). Not yet run: there has been no
    # Apple Developer account to try it with, so a failure here does not fail the build.
    - name: Sign and send to TestFlight (only with the Apple secrets)
      if: inputs.publish == 'true' && inputs.asc_key_id != '' && inputs.asc_issuer_id != '' && inputs.asc_key_p8 != '' && inputs.apple_team_id != ''
      continue-on-error: true
      shell: bash
      env:
        ASC_KEY_ID: ${{ inputs.asc_key_id }}
        ASC_ISSUER_ID: ${{ inputs.asc_issuer_id }}
        ASC_KEY_P8: ${{ inputs.asc_key_p8 }}
        APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
      run: |
        K="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"; mkdir -p "$RUNNER_TEMP/asc"; printf '%s\n' "$ASC_KEY_P8" > "$K"
        AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$K" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
        AR="$RUNNER_TEMP/Electo-signed.xcarchive"
        ( cd app/ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$AR" -quiet "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$APP_VERSION_NAME" CURRENT_PROJECT_VERSION="$APP_BUILD" archive )
        cat > "$RUNNER_TEMP/export.plist" <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>signingStyle</key><string>automatic</string>
        </dict></plist>
        EOF
        xcodebuild -exportArchive -archivePath "$AR" -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
        rm -f "$K"
        echo "sent to App Store Connect (TestFlight) as build $APP_BUILD" | tee -a "$GITHUB_STEP_SUMMARY"
